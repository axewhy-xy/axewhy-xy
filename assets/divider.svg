<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="14" viewBox="0 0 1200 14" role="img" aria-label="Section divider"><style>.run{animation:run 4.0s cubic-bezier(.45,0,.55,1) infinite}.dot{animation:pulse 2.0s ease-in-out infinite}@keyframes run{from{transform:translateX(-360px)}to{transform:translateX(1200px)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.run,.dot{animation:none}.run{opacity:0}}</style><defs><linearGradient id="track" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/><stop offset=".12" stop-color="#8b5cf6" stop-opacity=".55"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".55"/><stop offset=".88" stop-color="#f472b6" stop-opacity=".55"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></linearGradient><linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/><stop offset=".55" stop-color="#8b5cf6" stop-opacity=".8"/><stop offset=".85" stop-color="#22d3ee"/><stop offset=".97" stop-color="#f472b6"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></linearGradient><filter id="glow" x="-10%" y="-200%" width="120%" height="500%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".08" stop-color="#fff"/><stop offset=".92" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><mask id="edgeMask"><rect width="1200" height="14" fill="url(#edge)"/></mask></defs><rect x="0" y="6.0" width="1200" height="2" rx="1" fill="url(#track)"/><g mask="url(#edgeMask)"><g class="run"><rect x="0" y="5.5" width="360" height="3" rx="1.5" fill="url(#pulse)" filter="url(#glow)"/></g></g><circle class="dot" cx="600.0" cy="7.0" r="3" fill="#22d3ee" filter="url(#glow)"/></svg>
