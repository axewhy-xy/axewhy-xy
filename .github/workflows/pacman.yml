name: Generate contribution pac-man

on:
  schedule:
    - cron: "0 0 * * *" # every day at 00:00 UTC
  workflow_dispatch: # allow manual runs from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pacman
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository (for the post-processing script)
        uses: actions/checkout@v4

      - name: Generate pac-man SVGs from the contribution graph
        uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman

      - name: Add start, defeat and victory screens
        run: python3 scripts/pacman_screens.py dist/*.svg

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update contribution pac-man"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
